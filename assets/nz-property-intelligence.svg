<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">PropData New Zealand property intelligence visual</title>
<desc id="desc">A custom aerial-style property intelligence graphic showing New Zealand, parcel boundaries, building footprints, title relationships and data provenance.</desc>
<defs>
