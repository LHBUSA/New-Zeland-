name: Promote NZ current posture

on:
  push:
    paths:
      - .github/workflows/promote-nz-current-posture.yml
      - scripts/promote_nz_current_posture.py
      - scripts/finalize_nz_current_posture.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply current New Zealand posture
        run: |
          python3 scripts/promote_nz_current_posture.py
          python3 scripts/finalize_nz_current_posture.py

      - name: Verify generated site
        run: |
          grep -F 'NZ_POSTURE_2026_09_13' index.html >/dev/null
          grep -F 'NZ_POSTURE_2026_09_13' docs/index.html >/dev/null
          grep -F 'NZ_POSTURE_2026_09_13' workspace.html >/dev/null
          grep -F 'NZ_POSTURE_2026_09_13' platform.html >/dev/null
          grep -F 'Eleven infrastructure layers' docs/index.html >/dev/null
          grep -F '11 infrastructure layers' workspace.html >/dev/null
          grep -F '32.86M+' index.html >/dev/null
          grep -F '5.73M' workspace.html >/dev/null
          git diff --check

      - name: Commit generated site files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html platform.html docs/index.html workspace.html sitemap.xml
          if git diff --cached --quiet; then
            echo 'No generated changes required.'
            exit 0
          fi
          git commit -m 'Finalize NZ site for completed national graph posture'
          git push origin HEAD:main
