name: Promote NZ developer localization

on:
  push:
    paths:
      - .github/workflows/promote-nz-legal-actions-docs.yml
      - scripts/promote_nz_language_and_legal_docs.py

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fail-closed NZ docs and workspace patch
        run: python3 scripts/promote_nz_language_and_legal_docs.py

      - name: Verify JavaScript syntax
        run: node --check site.js

      - name: Verify localized production contract
        run: |
          grep -F 'aria-label="Language / Reo"' docs/index.html >/dev/null
          grep -F 'aria-label="Language / Reo"' workspace.html >/dev/null
          grep -F 'PROPDATA_NZ_DEVELOPER_I18N_V1' site.js >/dev/null
          grep -F 'new_zealand.legal_actions' docs/index.html >/dev/null
          grep -F 'new_zealand.legal_actions' workspace.html >/dev/null
          grep -F 'data-legal-canary' workspace.html >/dev/null
          git diff --check
          echo 'NZ DEVELOPER LOCALIZATION VERIFY: PASS'

      - name: Commit generated site files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site.js docs/index.html workspace.html
          if git diff --cached --quiet; then
            echo 'No generated changes required.'
            exit 0
          fi
          git commit -m 'Add EN MI language switch to NZ docs and workspace'
          git push origin HEAD:main
