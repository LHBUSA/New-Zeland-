name: Enable New Zealand trust badges

on:
  push:
    paths:
      - .github/workflows/enable-trust-badges.yml

permissions:
  contents: write

jobs:
  rollout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Wire trust badges site-wide
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('site.js')
          s=p.read_text()
          call="  load('/trust-badges.js');\n"
          if call not in s:
              anchor="  load('/site.core.js',()=>load('/product-demo.js',()=>{"
              if anchor not in s:
                  raise SystemExit('NZ site loader anchor not found')
              s=s.replace(anchor,call+anchor,1)
          p.write_text(s)
          PY
          node --check site.js
          node --check trust-badges.js
          grep -q "load('/trust-badges.js')" site.js
      - name: Commit rollout
        shell: bash
        run: |
          git config user.name "PropData New Zealand Build Bot"
          git config user.email "buildbot@proptechusa.ai"
          git rm .github/workflows/enable-trust-badges.yml
          git add site.js trust-badges.js
          git diff --cached --check
          git commit -m "Add Mother AI and PropData badges to New Zealand"
          git push origin HEAD:main
